<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Heiwase Karate Szeged</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="css/app.css" />
    <link href="https://fonts.googleapis.com/css2?family=Dosis:wght@300;400;600;800&family=League+Gothic&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="Heiwase.App.Blazor.styles.css" rel="stylesheet" /> 
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <div style="display: flex; top: 0; left: 0; justify-content: center; align-items: center; width: 100%; height: 100vh; font-family: sans-serif; background: linear-gradient(135deg, #000000, #3533cd); margin: 0;">
            <img src="img/loading.gif" alt="Loading" width="500" style="justify-self: center;" />
            <p style="font-family: Dosis; font-weight: 900; color: white; justify-self: center;">BETÖLTÉS...</p>
        </div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <div id="fb-root"></div>
    <script async defer crossorigin="anonymous" src="https://connect.facebook.net/hu_HU/sdk.js#xfbml=1&version=v24.0&appId=1642976156214421"></script>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
    <script>
        window.blazorIntersectionObserver = {
            observe: function (element) {
                const observer = new IntersectionObserver((entries) => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting) {
                            element.classList.add('visible');
                            observer.unobserve(element);
                        }
                    });
                }, { threshold: 0.1 });
                observer.observe(element);
            }
        };
    </script>
</body>

</html>
