name: PR Tests

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - master

concurrency:
  group: pr-tests-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    name: Unit tests and coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore .NET local tools
        run: dotnet tool restore

      - name: Test with coverage
        run: >
          dotnet test Heiwase.App.slnx
          --settings tests/coverage.runsettings
          --collect:"XPlat Code Coverage"
          --results-directory ./TestResults
          --logger "trx;LogFilePrefix=results"

      - name: Coverage gate and report generation
        run: |
          dotnet tool run reportgenerator \
            "-reports:TestResults/**/coverage.cobertura.xml" \
            "-targetdir:TestResults/CoverageReport" \
            "-reporttypes:HtmlInline_AzurePipelines;TextSummary;MarkdownSummaryGithub" \
            "-minimumcoverage:80"
          cat TestResults/CoverageReport/Summary.txt

      - name: Test report (pass/fail)
        if: always()
        run: python .github/scripts/test_report.py

      - name: Summary
        if: always()
        run: |
          if [ -f TestResults/CoverageReport/SummaryGithub.md ]; then
            cat TestResults/CoverageReport/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: TestResults/

  code-analysis:
    name: Static Code Analysis (CodeQL & Roslyn)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: csharp
          queries: security-and-quality

      - name: Build Solution with Roslyn Analyzers
        run: dotnet build Heiwase.App.slnx --configuration Release

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:csharp"

  mutation:
    name: Mutation tests (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - run: dotnet tool restore

      - name: Stryker (changed files only)
        working-directory: tests/Heiwase.App.Tests.Unit
        run: dotnet tool run dotnet-stryker --since:origin/${{ github.base_ref }}

      - name: Mutation summary
        if: always()
        run: python .github/scripts/mutation_summary.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-report
          path: tests/Heiwase.App.Tests.Unit/StrykerOutput/
